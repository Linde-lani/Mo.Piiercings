<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mo's Piercings | LogIn</title>
    <link rel="stylesheet" href="css/styles.css?v=13" />
    <style>
    /* Auth page styles moved from css/styles.css to reduce global scope */
    .auth-page {
        min-height: 75vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 3em 1.5em;
        background: linear-gradient(135deg, #1a1a1a 0%, #2d5f3f 100%);
    }

    .auth-shell {
        width: min(100%, 1000px);
        display: grid;
        grid-template-columns: repeat(2, minmax(280px, 1fr));
        gap: 2em;
        background: rgba(255, 255, 255, 0.05);
        border: 2px solid rgba(212, 175, 55, 0.8);
        border-radius: 18px;
        padding: 2em;
    }

    .auth-panel {
        background: #fff;
        border: 2px solid #D4AF37;
        border-radius: 14px;
        padding: 2em;
    }

    .auth-panel h2 {
        color: #1a1a1a;
        text-align: center;
        margin-bottom: 1.5em;
        font-size: 2em;
        letter-spacing: 1px;
    }

    .auth-form { display: flex; flex-direction: column; gap: 1em; }

    .text-link { display: inline-block; margin: 0.2em 0 1em; color: #2d5f3f; text-decoration: none; font-weight: 600; }
    .text-link:hover { text-decoration: underline; }
    </style>
</head>
<body class="auth-entry-page">
    <header>
        <div class="header-brand-wrap">
            <img src="pictures/logo.webp" alt="Mo Piiercings logo" class="site-logo" width="44" height="44">
            <h1>Mo Piiercings & Co</h1>
        </div>
        <div class="header-actions">
            <nav class="site-navigation">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="products.html">Products & Services</a></li>
                    <li><a href="bookings.html">Bookings</a></li>
                    <li><a href="contact.html">Contact Us</a></li>
                    <li><a href="about.html">About Us</a></li>
                    <li class="profile-nav-item"><a href="profile.html">Profile</a></li>
                    <li><a href="cart.html">Cart <span class="cart-count">0</span></a></li>
                    <li><a href="admin.html" data-admin-link>Admin Dashboard</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="auth-page single-auth-page">
        <section class="auth-panel auth-single-panel">
            <h2>LogIn</h2>
            <form class="auth-form" id="login-form" method="post">
                <div class="form-group">
                    <label for="login-email">Email</label>
                    <input id="login-email" type="email" name="email" placeholder="Email" required />
                </div>

                <div class="form-group">
                    <label for="login-password">Password</label>
                    <input id="login-password" type="password" name="password" placeholder="Password" required />
                </div>

                <a href="#" class="text-link" data-reset-password>Forgot password?</a>
                <p id="login-message" aria-live="polite"></p>
                <button type="submit" value="customer">Login</button>
                <button type="submit" class="btn secondary" value="admin">Admin Dashboard</button>
                
            </form>
            <p class="auth-switch">Don't have an account? <a href="register.html">Register here</a>.</p>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Mo Piiercings & Co. All rights reserved.</p>
        <button type="button" class="logout-button" id="logout-link">LogOut</button>
    </footer>

    <script type="module" src="js/auth.js?v=20261019-2"></script>
</body>
</html>
